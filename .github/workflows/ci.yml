# EcoLib CI: build the whole library at its pinned Lean and Mathlib, then re-run the axiom audit.
# Written by the viridis-engine `ecolib` workflow; edits here are overwritten on the next release.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL --retry 5 https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib cache
        run: |
          cp lake-manifest.json "$RUNNER_TEMP/manifest.json"
          lake exe cache get
          cmp lake-manifest.json "$RUNNER_TEMP/manifest.json"
      - name: Build every module and the root
        run: lake build
      - name: Axiom audit (every declaration; only propext, Quot.sound, Classical.choice)
        run: python3 scripts/audit.py
